<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toán Học - Word Add-in</title>
    <!-- Office JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
        background-color: #faf9f8;
        color: #242424;
      }
      .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 250px;
        padding: 24px;
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #c7e0f4;
        border-top: 4px solid #0f6cbd;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-box">
        <div class="spinner"></div>
        <h3 style="color: #0f6cbd; margin: 0 0 8px 0;">Đang khởi động Toán Học Word Add-in...</h3>
        <p style="color: #666; font-size: 13px; margin: 0;">Đang nạp các mô-đun công cụ, vui lòng đợi...</p>
      </div>
    </div>

    <!-- On-screen error alert box for debugging -->
    <div id="js-error-box" style="display:none; margin: 16px; padding: 14px; background: #fde7e9; border: 1px solid #d13438; color: #a80000; border-radius: 6px; font-family: monospace; font-size: 13px;"></div>

    <script>
      window.onerror = function(msg, url, line, col, err) {
        var box = document.getElementById('js-error-box');
        if (box) {
          box.style.display = 'block';
          box.innerHTML += '<div><b>⚠️ Lỗi Javascript:</b> ' + msg + '<br/><small>' + url + ':' + line + '</small></div>';
        }
      };
      window.onunhandledrejection = function(e) {
        var box = document.getElementById('js-error-box');
        if (box) {
          box.style.display = 'block';
          box.innerHTML += '<div><b>⚠️ Lỗi Promise:</b> ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '</div>';
        }
      };
    </script>

    <script type="module" src="/src/taskpane/index.tsx"></script>
  </body>
</html>
